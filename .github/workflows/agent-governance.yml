name: Agent Development Governance

on:
  pull_request:
    branches:
      - openJiuwen-Solar
  push:
    branches:
      - openJiuwen-Solar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-attestation:
    name: Governance attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full change history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Audit adapter wiring
        run: python3 tools/agent-development-governance/governance.py audit --project . --strict-warnings

      - name: Resolve change baseline
        id: baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          baseline="$PR_BASE"
          if [ -z "$baseline" ]; then
            baseline="$PUSH_BASE"
          fi
          if [ -z "$baseline" ] || ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            baseline="$(git rev-parse HEAD^)"
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"

      - name: Verify portable governance controls
        run: |
          python3 tools/agent-development-governance/governance.py verify \
            --project . \
            --changed-from "${{ steps.baseline.outputs.sha }}" \
            --scope ci-contract \
            --level full \
            --report "$RUNNER_TEMP/governance-attestation.json"

      - name: Reject stale or incomplete evidence
        run: |
          python3 tools/agent-development-governance/governance.py attest \
            --project . \
            --report "$RUNNER_TEMP/governance-attestation.json" \
            --require-level full

      - name: Publish exact-commit attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/governance-attestation.json
          if-no-files-found: error
